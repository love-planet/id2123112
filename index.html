
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#180e1b">
<title>LOVE SIGNAL — знакомства</title>

<style>
:root {
  color-scheme: light dark;
  --bg: #180e1b;
  --panel: #241322;
  --text: #fff7fb;
  --muted: #cbb9c8;
  --pink: #ff4f91;
  --coral: #ff826f;
  --line: rgba(255,255,255,.13);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Inter, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  background: #180e1b;
  color: var(--text);
}

body {
  min-height: 100svh;
  overflow-x: hidden;
}

#app {
  min-height: 100svh;
  min-height: 100dvh;
  width: 100%;
  background: url("https://i.postimg.cc/76CC585T/photo-2026-10-14-23-17-26.jpg?v=2")
    center center / contain no-repeat #000;
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.glow {
  position: absolute;
  z-index: -1;
  width: 270px;
  height: 270px;
  border-radius: 50%;
  filter: blur(65px);
  opacity: .3;
  background: #ff367f;
  top: 4%;
  right: -130px;
}

.glow.two {
  width: 210px;
  height: 210px;
  background: #ff8d78;
  top: auto;
  right: auto;
  bottom: 2%;
  left: -110px;
}

.wrap {
  width: min(100%, 420px);
  text-align: center;
  position: relative;
}

.brand {
  display: none;
  justify-content: center;
  align-items: center;
  gap: 9px;
  font-size: 12px;
  letter-spacing: .22em;
  font-weight: 800;
  color: #ffd5e6;
}

.brand-mark {
  width: 29px;
  height: 29px;
  border-radius: 10px;
  background: linear-gradient(145deg, var(--pink), var(--coral));
  display: grid;
  place-items: center;
  box-shadow: 0 5px 22px #ff4f9140;
  font-size: 16px;
  letter-spacing: 0;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  margin: 27px auto 16px;
  border: 1px solid var(--line);
  background: #ffffff09;
  border-radius: 999px;
  padding: 8px 12px;
  color: #f4dce9;
  font-size: 11px;
  letter-spacing: .08em;
  text-transform: uppercase;
}

.dot {
  width: 6px;
  height: 6px;
  background: #ff6f9f;
  border-radius: 50%;
  box-shadow: 0 0 10px #ff6f9f;
}

h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(43px, 12vw, 62px);
  line-height: .99;
  letter-spacing: -.045em;
  font-weight: 500;
  margin: 0 auto 18px;
  max-width: 370px;
}

h1 em {
  font-weight: 500;
  color: #ff82ac;
}

.sub {
  color: var(--muted);
  font-size: 15px;
  line-height: 1.65;
  max-width: 315px;
  margin: 0 auto;
}

.art {
  height: 230px;
  position: relative;
  margin: 18px auto 14px;
  max-width: 340px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.halo {
  position: absolute;
  width: 205px;
  height: 205px;
  border-radius: 50%;
  border: 1px solid #ff8cb32e;
  background: radial-gradient(circle, #ff54801d 0, transparent 68%);
}

.portrait {
  position: relative;
  width: 155px;
  height: 188px;
  border-radius: 88px 88px 55px 55px;
  overflow: hidden;
  border: 1px solid #ffffff24;
  background: linear-gradient(160deg, #f7a6b9, #8e4269 60%, #30162e);
  box-shadow: 0 20px 70px #f64a8228;
}

.portrait:before {
  content: "";
  position: absolute;
  width: 78px;
  height: 94px;
  border-radius: 48% 48% 44% 44%;
  background: linear-gradient(110deg, #f5c5b0, #c47e79);
  left: 39px;
  top: 34px;
  box-shadow: 0 -17px 0 7px #33202d;
}

.portrait:after {
  content: "";
  position: absolute;
  width: 125px;
  height: 105px;
  border-radius: 60% 60% 0 0;
  background: linear-gradient(120deg, #34202f, #170f1b);
  left: 15px;
  bottom: -28px;
}

.spark {
  position: absolute;
  color: #ffabc7;
  font-size: 23px;
  animation: float 3.5s ease-in-out infinite;
}

.s1 {
  top: 35px;
  left: 39px;
}

.s2 {
  right: 35px;
  top: 58px;
  font-size: 17px;
  animation-delay: .7s;
}

.s3 {
  bottom: 30px;
  left: 55px;
  font-size: 15px;
  animation-delay: 1.2s;
}

.bubble {
  position: absolute;
  border: 1px solid #ffffff20;
  background: #2b1828dd;
  backdrop-filter: blur(10px);
  border-radius: 14px;
  padding: 10px 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  color: #fff0f6;
  box-shadow: 0 12px 35px #0002;
}

.bubble b {
  display: block;
  font-size: 12px;
}

.bubble small {
  display: block;
  color: #cdb8c8;
  margin-top: 2px;
}

.b1 {
  left: 0;
  top: 88px;
}

.b2 {
  right: 0;
  bottom: 39px;
}

.mini-heart {
  color: #ff79a7;
  font-size: 17px;
}

.hint {
  font-size: 11px;
  line-height: 1.4;
  color: #fff;
  margin: 0 0 9px;
  text-shadow: 0 1px 3px #000;
}

.cta {
  width: min(290px, calc(100vw - 40px));
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 0;
  border-radius: 14px;
  padding: 16px 20px;
  min-height: 56px;
  background: linear-gradient(105deg, #ff4f91, #ff786f);
  color: white;
  text-decoration: none;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: .01em;
  box-shadow: 0 8px 24px #0003;
  transition: transform .18s, filter .18s;
}

.cta:active {
  transform: scale(.985);
  filter: brightness(.96);
}

.tg-icon {
  width: 22px;
  height: 22px;
  flex: none;
}

.foot, .desktop {
  display: none;
}

@keyframes float {
  0%, 100% {
    transform: translateY(0) rotate(0);
  }
  50% {
    transform: translateY(-7px) rotate(5deg);
  }
}

@media (min-width: 700px) {
  #app {
    background-position: center;
    background-size: contain;
    background-attachment: scroll;
  }

  .wrap {
    max-width: 440px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *:before, *:after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<div id="app">
  <main class="wrap">

    <p class="hint" id="languageHint">
      Если не открыло ТГ канал, нажми ↗️↗️ вверху ▪️▪️▪️ и Открыть в Браузере.
    </p>

    <a
      class="cta"
      id="telegramBtn"
      href="https://t.me/pys365"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg
        class="tg-icon"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M21.4 4.6 18.2 20c-.24 1.09-.87 1.36-1.77.85l-4.9-3.61-2.37 2.28c-.26.26-.48.48-.98.48l.35-4.98 9.07-8.2c.39-.35-.09-.55-.6-.2L5.79 13.85.96 12.34c-1.05-.33-1.07-1.05.22-1.56L20.06 3.4c.87-.32 1.63.21 1.34 1.2Z"
          fill="currentColor"
        />
      </svg>

      <span
        id="buttonText"
        data-ru="Продолжить в Telegram"
        data-en="Continue to Telegram"
      >Продолжить в Telegram</span>

      <span aria-hidden="true">↗</span>
    </a>

  </main>
</div>

<script>
(() => {
  const lang = (
    navigator.languages && navigator.languages[0] ||
    navigator.language ||
    'ru'
  ).toLowerCase();

  const isEnglish = /^(en)(-|$)/.test(lang);

  const hint = document.getElementById('languageHint');
  const button = document.getElementById('buttonText');

  if (isEnglish) {
    document.documentElement.lang = 'en';

    hint.textContent =
      'If the Telegram channel didn’t open, tap ↗️↗️ at the top ▪️▪️▪️ and select “Open in Browser.”';

    button.textContent = button.dataset.en;
  } else {
    document.documentElement.lang = 'ru';

    hint.textContent =
      'Если не открыло ТГ канал, нажми ↗️↗️ вверху ▪️▪️▪️ и Открыть в Браузере.';

    button.textContent = button.dataset.ru;
  }
})();
</script>

</body>
</html>
