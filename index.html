
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Continue to Telegram</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #fff;
      background:
        linear-gradient(rgba(0, 0, 0, 0.35), rgba(0, 0, 0, 0.55)),
        url("https://i.postimg.cc/76CC585T/photo-2026-10-14-23-17-26.jpg?v=2")
        center center / cover no-repeat fixed;
    }

    .container {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .telegram-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: 56px;
      padding: 16px 20px;
      border: none;
      border-radius: 12px;
      background: #229ed9;
      color: #fff;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.3;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    .telegram-button.disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .hint {
      margin-top: 18px;
      font-size: 14px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.95);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
    }

    .progress {
      display: none;
      height: 4px;
      margin-top: 14px;
      overflow: hidden;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.25);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: #229ed9;
    }

    .progress.active {
      display: block;
    }
  </style>
</head>

<body>
  <main class="container">
    <a
      id="telegramLink"
      class="telegram-button"
      href="https://t.me/pys365"
    >
      Продолжить в Telegram
    </a>

    <div id="hint" class="hint"></div>

    <div id="progress" class="progress">
      <div id="progressBar" class="progress-bar"></div>
    </div>
  </main>

  <script>
    (() => {
      const telegram = "https://t.me/pys365";
      const ua = navigator.userAgent || "";

      const link = document.getElementById("telegramLink");
      const hint = document.getElementById("hint");
      const progress = document.getElementById("progress");
      const progressBar = document.getElementById("progressBar");

      const isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (navigator.platform === "MacIntel" &&
         navigator.maxTouchPoints > 1);

      const isInApp =
        /TikTok|musical_ly|Bytedance|Instagram|FBAN|FBAV|FB_IAB|Line\/|Twitter|Snapchat|;\s?wv\)/i.test(ua);

      const language = (navigator.language || "ru").toLowerCase();
      const en = language.startsWith("en");

      let holdTimer = null;
      let animationFrame = null;
      let holdStarted = 0;

      function cancelHold() {
        if (holdTimer !== null) {
          clearTimeout(holdTimer);
          holdTimer = null;
        }

        if (animationFrame !== null) {
          cancelAnimationFrame(animationFrame);
          animationFrame = null;
        }

        progress.classList.remove("active");
        progressBar.style.width = "0%";
      }

      // Во внешнем браузере сразу открываем Telegram.
      if (!isInApp) {
        window.location.replace(telegram);
        return;
      }

      // Встроенный браузер iOS.
      if (isIOS) {
        hint.textContent = en
          ? 'If Telegram doesn’t open, press and hold the button for 5 seconds, then tap “…” and choose “Open in Browser.”'
          : 'Если Telegram не открылся, нажми и удерживай кнопку 5 секунд. Если не сработает, нажми «…» и выбери «Открыть в браузере».';

        link.removeAttribute("target");
        link.removeAttribute("href");
        link.classList.remove("disabled");
        link.removeAttribute("aria-disabled");

        link.style.pointerEvents = "auto";
        link.style.userSelect = "none";
        link.style.webkitUserSelect = "none";
        link.style.webkitTouchCallout = "none";
        link.style.touchAction = "none";

        // Не показываем системное меню при удержании.
        link.addEventListener("contextmenu", event => {
          event.preventDefault();
        });

        // Обычное нажатие не открывает Telegram.
        link.addEventListener("click", event => {
          event.preventDefault();
        });

        // Запуск пятисекундного удержания.
        link.addEventListener("pointerdown", event => {
          if (event.pointerType === "mouse") return;

          cancelHold();
          holdStarted = performance.now();
          progress.classList.add("active");

          const updateProgress = () => {
            const elapsed = performance.now() - holdStarted;
            const percent = Math.min((elapsed / 5000) * 100, 100);

            progressBar.style.width = percent + "%";

            if (elapsed < 5000) {
              animationFrame = requestAnimationFrame(updateProgress);
            }
          };

          animationFrame = requestAnimationFrame(updateProgress);

          holdTimer = setTimeout(() => {
            holdTimer = null;

            if (animationFrame !== null) {
              cancelAnimationFrame(animationFrame);
              animationFrame = null;
            }

            progressBar.style.width = "100%";
            window.location.href = telegram;
          }, 5000);
        });

        link.addEventListener("pointerup", cancelHold);
        link.addEventListener("pointercancel", cancelHold);
        link.addEventListener("pointerleave", cancelHold);

      } else {
        // Android и остальные устройства во встроенном браузере.
        hint.textContent = en
          ? 'Tap ⋯ at the top and select "Open in Browser".'
          : 'Нажми ⋯ вверху и выбери «Открыть в браузере».';

        link.removeAttribute("href");
        link.removeAttribute("target");
        link.classList.add("disabled");
        link.setAttribute("aria-disabled", "true");
        link.style.pointerEvents = "none";
      }
    })();
  </script>
</body>
</html>
