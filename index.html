
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#180e1b">
<title>LOVE SIGNAL ❤️</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(ellipse at 15% 15%, #79264c55, transparent 40%),
        radial-gradient(ellipse at 90% 80%, #ff5b792b, transparent 35%),
        #180e1b;
    color: #fff7fb;
    font-family: Arial, sans-serif;
}

.container {
    min-height: 100vh;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px 20px;
}

.content {
    width: 100%;
    max-width: 390px;
    text-align: center;
}

.logo {
    font-size: 13px;
    letter-spacing: 4px;
    font-weight: bold;
    color: #ffd5e6;
}

.logo span {
    color: #ff6098;
    font-size: 23px;
    vertical-align: middle;
    margin-right: 8px;
}

.label {
    display: inline-block;
    margin: 35px 0 18px;
    padding: 9px 14px;
    border: 1px solid #ffffff24;
    border-radius: 30px;
    background: #ffffff08;
    color: #ffc7dc;
    font-size: 11px;
    letter-spacing: 1px;
}

h1 {
    font-family: Georgia, serif;
    font-weight: normal;
    font-size: clamp(42px, 11vw, 57px);
    line-height: 1.05;
    margin-bottom: 17px;
}

h1 em {
    color: #ff82ac;
    font-weight: normal;
}

.description {
    max-width: 320px;
    margin: 0 auto;
    color: #cbb9c8;
    font-size: 15px;
    line-height: 1.7;
}

.art {
    height: 245px;
    display: flex;
    justify-content: center;
    align-items: center;
    position: relative;
    margin: 10px 0;
}

.halo {
    position: absolute;
    width: 205px;
    height: 205px;
    border-radius: 50%;
    border: 1px solid #ff8cb333;
    background: radial-gradient(circle, #ff54801c, transparent 70%);
}

.portrait {
    width: 150px;
    height: 185px;
    border-radius: 90px 90px 55px 55px;
    position: relative;
    overflow: hidden;
    border: 1px solid #ffffff30;
    background: linear-gradient(160deg, #f7a6b9, #8e4269 60%, #30162e);
    box-shadow: 0 20px 70px #f64a8230;
}

.portrait::before {
    content: "";
    position: absolute;
    width: 78px;
    height: 94px;
    border-radius: 48%;
    background: linear-gradient(110deg, #f5c5b0, #c47e79);
    left: 35px;
    top: 34px;
    box-shadow: 0 -17px 0 7px #33202d;
}

.portrait::after {
    content: "";
    position: absolute;
    width: 125px;
    height: 105px;
    border-radius: 60% 60% 0 0;
    background: linear-gradient(120deg, #34202f, #170f1b);
    left: 12px;
    bottom: -28px;
}

.heart {
    position: absolute;
    color: #ff8db4;
    font-size: 26px;
    animation: float 3s ease-in-out infinite;
}

.heart.one {
    left: 35px;
    top: 40px;
}

.heart.two {
    right: 32px;
    top: 65px;
    animation-delay: .7s;
}

.heart.three {
    left: 55px;
    bottom: 35px;
    animation-delay: 1.2s;
}

.bubble {
    position: absolute;
    padding: 11px 13px;
    border-radius: 14px;
    background: #2b1828ed;
    border: 1px solid #ffffff20;
    box-shadow: 0 12px 35px #0003;
    color: #fff0f6;
    font-size: 11px;
    text-align: left;
}

.bubble b {
    display: block;
    margin-bottom: 4px;
}

.bubble small {
    color: #cdb8c8;
}

.bubble.left {
    left: 0;
    top: 90px;
}

.bubble.right {
    right: 0;
    bottom: 40px;
}

.button {
    width: 100%;
    min-height: 59px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px;
    border-radius: 17px;
    background: linear-gradient(105deg, #ff4f91, #ff786f);
    color: white;
    text-decoration: none;
    font-size: 15px;
    font-weight: bold;
    box-shadow: 0 12px 32px #ff4f913b;
    transition: transform .2s, filter .2s;
}

.button:hover {
    filter: brightness(1.08);
    transform: translateY(-2px);
}

.button:active {
    transform: scale(.98);
}

.telegram-icon {
    width: 23px;
    height: 23px;
}

.footer {
    margin-top: 17px;
    color: #a995a4;
    font-size: 11px;
}

.footer span {
    color: #ff82ac;
}

@keyframes float {
    0%, 100% {
        transform: translateY(0);
    }
    50% {
        transform: translateY(-9px);
    }
}

@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        animation: none !important;
        transition: none !important;
    }
}
</style>
</head>

<body>

<main class="container">
    <div class="content">

        <div class="logo">
            <span>♥</span> LOVE SIGNAL
        </div>

        <div class="label">
            ✦ ТВОЙ ЗНАК СВЕРХУ
        </div>

        <h1>
            Иногда всё<br>
            начинается с <em>привет.</em>
        </h1>

        <p class="description">
            Новые знакомства, лёгкий флирт и люди,
            с которыми совпадает настроение.
        </p>

        <div class="art" aria-hidden="true">
            <div class="halo"></div>

            <span class="heart one">✦</span>
            <span class="heart two">♡</span>
            <span class="heart three">✧</span>

            <div class="portrait"></div>

            <div class="bubble left">
                <b>♡ Есть совпадение?</b>
                <small>Возможно, это оно</small>
            </div>

            <div class="bubble right">
                <b>✦ Твоя история</b>
                <small>Начинается здесь</small>
            </div>
        </div>

        <!-- Ссылка на Telegram -->
        <a
            class="button"
            href="https://t.me/pys365"
            target="_blank"
            rel="noopener noreferrer"
        >
            <svg
                class="telegram-icon"
                viewBox="0 0 24 24"
                fill="currentColor"
                aria-hidden="true"
            >
                <path d="M21.4 4.6 18.2 20c-.24 1.09-.87 1.36-1.77.85l-4.9-3.61-2.37 2.28c-.26.26-.48.48-.98.48l.35-4.98 9.07-8.2c.39-.35-.09-.55-.6-.2L5.79 13.85.96 12.34c-1.05-.33-1.07-1.05.22-1.56L20.06 3.4c.87-.32 1.63.21 1.34 1.2Z"/>
            </svg>

            <span>Продолжить в Telegram</span>
            <span>↗</span>
        </a>

        <p class="footer">
            Нажми, чтобы продолжить знакомство
            <span>♥</span>
        </p>

    </div>
</main>

</body>
</html>
