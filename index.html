
<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#180e1b">
<title>LOVE SIGNAL — знакомства</title>

<style>
:root {
  color-scheme: light dark;
  --bg: #180e1b;
  --text: #fff7fb;
  --muted: #cbb9c8;
  --pink: #ff4f91;
  --coral: #ff826f;
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: Inter, -apple-system, BlinkMacSystemFont,
    "Segoe UI", sans-serif;
  background: #180e1b;
  color: var(--text);
}

body {
  min-height: 100svh;
  overflow-x: hidden;
}

#app {
  min-height: 100svh;
  min-height: 100dvh;
  width: 100%;
  background: url("https://i.postimg.cc/76CC585T/photo-2026-10-14-23-17-26.jpg?v=2")
    center center / contain no-repeat #000;
  position: relative;
  isolation: isolate;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.wrap {
  width: min(100%, 420px);
  text-align: center;
  position: relative;
}

.hint {
  font-size: 11px;
  line-height: 1.5;
  color: #fff;
  margin: 0 auto 12px;
  max-width: 310px;
  text-shadow: 0 1px 3px #000;
}

.cta {
  width: min(290px, calc(100vw - 40px));
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border: 0;
  border-radius: 14px;
  padding: 16px 20px;
  min-height: 56px;
  background: linear-gradient(105deg, #ff4f91, #ff786f);
  color: white;
  text-decoration: none;
  font-weight: 800;
  font-size: 15px;
  letter-spacing: .01em;
  box-shadow: 0 8px 24px #ff4f9150;
  animation: pulse 1.8s ease-in-out infinite;
  transition: transform .18s, filter .18s;
}

.cta:active {
  transform: scale(.985);
  filter: brightness(.96);
  animation: none;
}

.tg-icon {
  width: 22px;
  height: 22px;
  flex: none;
}

@keyframes pulse {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 8px 24px #ff4f9150;
  }
  50% {
    transform: scale(1.035);
    box-shadow: 0 10px 32px #ff4f9180;
  }
}

@media (min-width: 700px) {
  #app {
    background-position: center;
    background-size: contain;
    background-attachment: scroll;
  }

  .wrap {
    max-width: 440px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *:before, *:after {
    animation: none !important;
    transition: none !important;
  }
}
</style>
</head>

<body>
<div id="app">
  <main class="wrap">

    <p class="hint" id="languageHint">
      Если не открыло ТГ канал, нажми ↗️↗️ вверху ▪️▪️▪️ и Открыть в Браузере.
    </p>

    <a
      class="cta"
      id="telegramBtn"
      href="https://t.me/pys365"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg
        class="tg-icon"
        viewBox="0 0 24 24"
        fill="none"
        aria-hidden="true"
      >
        <path
          d="M21.4 4.6 18.2 20c-.24 1.09-.87 1.36-1.77.85l-4.9-3.61-2.37 2.28c-.26.26-.48.48-.98.48l.35-4.98 9.07-8.2c.39-.35-.09-.55-.6-.2L5.79 13.85.96 12.34c-1.05-.33-1.07-1.05.22-1.56L20.06 3.4c.87-.32 1.63.21 1.34 1.2Z"
          fill="currentColor"
        />
      </svg>

      <span
        id="buttonText"
        data-ru="Продолжить в Telegram"
        data-en="Continue to Telegram"
      >Продолжить в Telegram</span>

      <span aria-hidden="true">↗</span>
    </a>

  </main>
</div>

<script>
(() => {
  const lang = (
    navigator.languages && navigator.languages[0] ||
    navigator.language ||
    'ru'
  ).toLowerCase();

  const isEnglish = /^(en)(-|$)/.test(lang);

  const isApple =
    /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
    (
      navigator.platform === 'MacIntel' &&
      navigator.maxTouchPoints > 1
    );

  const hint = document.getElementById('languageHint');
  const button = document.getElementById('buttonText');

  if (isEnglish) {
    document.documentElement.lang = 'en';

    hint.textContent = isApple
      ? 'If the Telegram channel didn’t open, press and hold the link for 2 seconds, then tap “...” and choose “Open in Browser.”'
      : 'If the Telegram channel didn’t open, tap ↗️↗️ at the top ▪️▪️▪️ and select “Open in Browser.”';

    button.textContent = button.dataset.en;
  } else {
    document.documentElement.lang = 'ru';

    hint.textContent = isApple
      ? 'Если Telegram не открылся, нажми и удерживай ссылку 2 секунды, затем нажми «…» и выбери «Открыть в браузере».'
      : 'Если не открыло ТГ канал, нажми ↗️↗️ вверху ▪️▪️▪️ и Открыть в Браузере.';

    button.textContent = button.dataset.ru;
  }
})();
</script>

</body>
</html>
